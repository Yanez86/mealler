# Mealler — avvio:  docker compose up -d
# Aggiornamento:    docker compose pull && docker compose up -d
services:
  mealler:
    image: ghcr.io/yanez86/mealler:latest
    # Per compilare l'immagine sul NAS invece di scaricarla: docker compose up -d --build
    build: .
    container_name: mealler
    restart: unless-stopped
    ports:
      # Dietro un reverse proxy o un tunnel metti MEALLER_BIND=127.0.0.1 nel file .env: la porta resta
      # raggiungibile solo dal server stesso, e a Mealler si arriva solo passando dal proxy (in HTTPS).
      - "${MEALLER_BIND:-0.0.0.0}:${MEALLER_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Rome}
      # Indirizzo pubblico, es. https://mealler.miodominio.it (serve per i link d'invito e il connettore claude.ai)
      MEALLER_BASE_URL: ${MEALLER_BASE_URL:-}
      # Le altre variabili del file .env (vedi .env.example): vuote = valore predefinito.
      MEALLER_TRUST_PROXY: ${MEALLER_TRUST_PROXY:-}
      MEALLER_SECRET_KEY: ${MEALLER_SECRET_KEY:-}
      MEALLER_UPDATE_CHECK: ${MEALLER_UPDATE_CHECK:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Il processo gira come utente senza privilegi e non ne può acquisire.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - mealler-data:/data
      # In alternativa, una cartella del NAS (deve essere scrivibile dall'utente con UID 1000):
      # - /volume1/docker/mealler:/data

volumes:
  mealler-data:
